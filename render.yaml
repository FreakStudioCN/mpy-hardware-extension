services:
  - type: web
    name: blockless-api
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: mpyhw-api/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health/ready
    envVars:
      - key: PORT
        value: "8080"
      # Load-bearing: the DeepSeek circuit breaker (_deepseek_breaker) is
      # in-process state, so more than one worker would give each its own
      # breaker. (llm_sessions is DB-backed with advisory locks and would
      # scale; the breaker would not.) Scaling out requires moving the
      # breaker to the DB.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MPYHW_ENV
        value: prod
      - key: MPYHW_PUBLIC_API_BASE
        value: https://blockless-api.onrender.com
      - key: MPYHW_BROWSER_AUTH_REDIRECT_ORIGINS
        value: https://block-less.com
      - key: MPYHW_GITHUB_CLIENT_ID
        sync: false
      - key: MPYHW_GITHUB_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: blockless-db
          property: connectionString
      - key: MPYHW_JWT_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MPYHW_ADMIN_TOKEN
        sync: false

databases:
  - name: blockless-db
    databaseName: mpyhw
    user: mpyhw
    plan: basic-256mb
    region: virginia
