name: publish-image

# Build the mpyhw-api backend image and push it to GitHub Container Registry (GHCR) so the
# server owner can `docker pull` it instead of building from source on the host.
#   Image: ghcr.io/freakstudiocn/mpyhw-api
# Runs on every push to main (publishes :latest + :sha-<commit>) and on v* tags (adds :<version>);
# also runnable on demand from the Actions tab.
#
# NOTE: the first publish creates the GHCR package as PRIVATE. A repo/org admin must set it to
# public (or the puller must `docker login ghcr.io`) before `docker pull` works unauthenticated.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build + push mpyhw-api image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }} 
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # The image needs third_party/MicroPython_Skills. GraftSense (also a submodule) commits a
      # corrupt symlink blob that fails on Linux, so materialize submodules with
      # core.symlinks=false (same pattern as ci.yml).
      - name: Check out submodules without symlinks
        run: |
          git config --global core.symlinks false
          git submodule update --init --recursive
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/freakstudiocn/mpyhw-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - name: Build + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mpyhw-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Single label, matching mpos's deploy job (micropythonos-ai-app-builder publish-image.yml)
    # on the same host. Labels only route; what limits the runner is where it is registered.
    # SECURITY (red line): this runner sits on the production host. Never add `pull_request` /
    # `pull_request_target` triggers to this workflow, and never check out or run repo code here.
    runs-on: upypi
    needs: image
    # A dispatch from any other branch would ship that branch's image to production.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # A hung pull never returns, so retries need a per-attempt bound (exit 124 -> retry).
      - name: Pull image by digest
        run: |
          ok=""
          for attempt in 1 2 3 4 5 6; do
            rc=0
            timeout 180 docker pull ghcr.io/freakstudiocn/mpyhw-api@${{ needs.image.outputs.digest }} || rc=$?
            if [ "$rc" = 0 ]; then ok=1; break; fi
            echo "pull attempt ${attempt} failed (rc=${rc})"
            sleep 10
          done
          [ -n "$ok" ] || { echo "pull failed after 6 attempts" >&2; exit 1; }

      - name: Tag as latest for compose
        run: docker tag ghcr.io/freakstudiocn/mpyhw-api@${{ needs.image.outputs.digest }} ghcr.io/freakstudiocn/mpyhw-api:latest

      # SHARED STACK: /srv/upypi/compose.yml also runs upypi, caddy and the mpos services.
      # Scope every compose call to mpyhw-api; never --remove-orphans, never `down`.
      - name: Deploy with compose
        run: |
          cd /srv/upypi
          timeout 300 docker compose up -d mpyhw-api
