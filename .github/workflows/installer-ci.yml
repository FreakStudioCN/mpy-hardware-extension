name: installer-ci

on:
  push:
    paths:
      - "blockless-installer/**"
      # A change to the workflow, or to the line-ending rules the tests depend
      # on, has to re-run the workflow. Without these two the fix for a red run
      # can land and CI stays silent, still showing the old failure.
      - ".github/workflows/installer-ci.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "blockless-installer/**"
      # A change to the workflow, or to the line-ending rules the tests depend
      # on, has to re-run the workflow. Without these two the fix for a red run
      # can land and CI stays silent, still showing the old failure.
      - ".github/workflows/installer-ci.yml"
      - ".gitattributes"

# A newer push to the same ref supersedes in-flight runs, so minutes are not
# spent on stale commits. This matters more here than in the extension
# workflow: three platforms, and the macOS and Windows jobs compile the whole
# Tauri dependency tree. `github.workflow` is part of the group, so an
# installer run can never cancel an extension run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow builds and tests. It publishes nothing and
# writes nothing back to the repository, so read is sufficient.
permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blockless-installer
    steps:
      - uses: actions/checkout@v4
      # rustup auto-installs the pinned toolchain (rust-toolchain.toml, incl. the
      # clippy/rustfmt components) the first time cargo/rustup runs in this dir.
      - name: show pinned toolchain
        run: rustup show
      # verify_parity_macos.rs shells out to verify-blockless.zsh by name. The
      # script is plain text and file manipulation with no macOS-only APIs, so
      # Linux zsh runs it correctly -- but ubuntu-latest ships no zsh at all,
      # and without this every parity test fails NotFound rather than on
      # anything it is meant to measure.
      - name: install zsh (the mac parity suite shells out to it)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blockless-installer
    steps:
      - uses: actions/checkout@v4
      - name: show pinned toolchain
        run: rustup show
      # macOS is half the acceptance rig and the primary dev platform, and two
      # things here are true of no other runner. Its filesystem is
      # case-insensitive by default, so sibling fixture paths differing only in
      # case collide (ENOTDIR) where ubuntu sees two distinct paths and passes.
      # And the mac script-parity suite (core/tests/verify_parity_macos.rs)
      # shells out to verify-blockless.zsh, so running it on a real Mac is the
      # closest CI gets to the rig.
      - name: cargo test
        run: cargo test --workspace
      # app/ is excluded from the root workspace (see blockless-installer/
      # Cargo.toml) and compiles only here and on windows -- it depends on
      # webkit2gtk system packages ubuntu doesn't have, and on
      # core::system::SystemEnvironment, which is itself cfg-gated to
      # macOS/Windows. No bundling here (`cargo tauri build`); that stays
      # local/rig-only.
      - name: app crate -- cargo fmt --check
        run: cargo fmt --manifest-path app/Cargo.toml -- --check
      - name: app crate -- cargo clippy
        run: cargo clippy --manifest-path app/Cargo.toml --all-targets -- -D warnings
      - name: app crate -- cargo test
        run: cargo test --manifest-path app/Cargo.toml

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blockless-installer
    steps:
      - uses: actions/checkout@v4
      - name: show pinned toolchain
        run: rustup show
      # pwsh path joins (Join-Path etc.) don't behave the same under a
      # non-Windows pwsh, so verify-blockless.ps1's parity test
      # (core/tests/verify_parity_windows.rs, #![cfg(windows)]) only ever
      # compiles/runs here -- cargo test on ubuntu skips it entirely.
      - name: cargo test
        run: cargo test --workspace
      # app/ (see the macos job's comment above for why it's excluded from
      # the root workspace). fmt is OS-independent and already checked on
      # macos, so this job just needs clippy + test -- test is what runs
      # both CRT-static guards (app/tests/windows_crt_static.rs) against
      # the real GUI exe.
      - name: app crate -- cargo clippy
        run: cargo clippy --manifest-path app/Cargo.toml --all-targets -- -D warnings
      - name: app crate -- cargo test
        run: cargo test --manifest-path app/Cargo.toml
