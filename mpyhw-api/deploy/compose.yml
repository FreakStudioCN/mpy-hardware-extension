# compose.yml - self-contained stack for mpyhw-api (the plugin / VS Code extension backend)
# behind an EXISTING Caddy reverse proxy. Everything is in THIS ONE FILE - no separate .env.
#
# Constraints (from the ops owner):
#   - Container only: pulls a prebuilt image from GHCR; no raw code / repo on the host.
#   - No host :80/:443 grab: the API is reachable ONLY on the shared Docker network; Caddy
#     reverse-proxies to `mpyhw-api:8080` (see Caddyfile.snippet). No host port is published.
#   - Single worker in prod (in-process session/rate-limit state).
#
# BEFORE RUNNING, fill every CHANGE-ME below:
#   [DB-PW]  one strong DB password, written in TWO spots that MUST match
#            (DATABASE_URL + POSTGRES_PASSWORD)          -> openssl rand -hex 16
#   MPYHW_JWT_SECRET                                     -> openssl rand -hex 32
#   MPYHW_ADMIN_TOKEN                                    -> openssl rand -hex 24
#   DEEPSEEK_API_KEY                                     -> your DeepSeek sk-... key
#   MPYHW_GITHUB_CLIENT_ID / _SECRET                     -> your GitHub OAuth app
#            (needed for user login; the backend still STARTS without them)
# To run on OpenAI instead of DeepSeek, uncomment MPYHW_LLM_PROVIDER + OPENAI_API_KEY
# in the environment block (two lines, nothing else changes).
# Also set the real Caddy network name at the bottom (`caddy_net`).
# NEVER commit a filled copy of this file to a public repo.
#
# Run:  docker compose -f compose.yml up -d

name: mpyhw

services:
  mpyhw-api:
    # Prebuilt image from GHCR (make the package public, or `docker login ghcr.io` first).
    image: ghcr.io/freakstudiocn/mpyhw-api:latest
    restart: unless-stopped
    environment:
      MPYHW_ENV: prod
      PORT: "8080"
      WEB_CONCURRENCY: "1"
      # [DB-PW] the password here MUST equal POSTGRES_PASSWORD in the db service below.
      DATABASE_URL: postgresql://mpyhw:CHANGE-ME-DB-PASSWORD@db:5432/mpyhw
      MPYHW_JWT_SECRET: CHANGE-ME-openssl-rand-hex-32
      MPYHW_ADMIN_TOKEN: CHANGE-ME-openssl-rand-hex-24
      DEEPSEEK_API_KEY: CHANGE-ME-your-deepseek-sk-key
      # LLM provider switch. Absent (or "deepseek") = the DeepSeek key above. To run on
      # OpenAI instead, uncomment BOTH lines below and LEAVE the DeepSeek key in place -
      # rollback is then just re-commenting them and `up -d` again.
      # Do NOT add MPYHW_LLM_MODEL here: each provider carries its own defaults (gpt-5.5
      # for codegen) and a value left over from the other provider 400s every request.
      # MPYHW_LLM_PROVIDER: openai
      # OPENAI_API_KEY: CHANGE-ME-your-openai-sk-key
      # Public HTTPS URL of THIS backend. The GitHub OAuth callback is built from it as
      # <MPYHW_PUBLIC_API_BASE>/v1/auth/github/callback - register that exact URL in the OAuth app.
      MPYHW_PUBLIC_API_BASE: https://blockless.upypi.net
      MPYHW_GITHUB_CLIENT_ID: CHANGE-ME
      MPYHW_GITHUB_CLIENT_SECRET: CHANGE-ME
    expose:
      - "8080"                 # visible to Caddy over the shared network, NOT published to the host
    networks: [edge, internal]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mpyhw
      POSTGRES_DB: mpyhw
      # [DB-PW] must equal the password embedded in DATABASE_URL above.
      POSTGRES_PASSWORD: CHANGE-ME-DB-PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpyhw -d mpyhw"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  edge:
    external: true
    name: caddy_net          # <-- CHANGE to ben0i0d's real Caddy docker network name
  internal:
    name: mpyhw_internal

volumes:
  pgdata:
    name: mpyhw_pgdata
